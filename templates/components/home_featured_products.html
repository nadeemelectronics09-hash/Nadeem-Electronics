<section class="dashboard-section dashboard-featured">
  <div class="container">
    <div class="dashboard-section-heading dashboard-section-heading-row">
      <div>
        <h2 class="section-title">Featured products</h2>
      </div>
      <a href="{{ url_for('public.shop') }}" class="dashboard-text-link">View all <span aria-hidden="true">→</span></a>
    </div>
    <div class="row g-3 g-lg-4 dashboard-product-grid">
      {% for product in featured_products %}
      <div class="col-6 col-lg-4">{% include '_product_card.html' %}</div>
      {% else %}
      <div class="col-12">
        <div class="dashboard-empty-state">No featured products yet.</div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
