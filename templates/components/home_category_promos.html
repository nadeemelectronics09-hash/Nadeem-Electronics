{% if categories %}
<section class="home-category-promos-section" aria-labelledby="home-category-promos-heading">
  <div class="container">
    <div class="dashboard-section-heading dashboard-section-heading-row">
      <div>
        <span class="home-section-eyebrow">FIND YOUR CATEGORY</span>
        <h2 class="section-title" id="home-category-promos-heading">Explore more of what you love.</h2>
      </div>
      <a href="{{ url_for('public.categories') }}" class="dashboard-text-link">All categories <span aria-hidden="true">→</span></a>
    </div>
    <div class="home-category-promo-grid">
      {% for category in categories[:3] %}
      <a class="home-category-promo home-category-promo-{{ loop.index }}" href="{{ url_for('public.category_detail', category_id=category.id) }}">
        <span class="home-category-promo-copy">
          <span>Explore the collection</span>
          <strong>{{ category.name }}</strong>
          <span class="home-category-promo-link">Shop category <span aria-hidden="true">→</span></span>
        </span>
        {% if category.image %}
        <img src="{{ url_for('public.uploaded_file', filename=category.image) }}" alt="" loading="lazy">
        {% else %}
        <span class="home-category-promo-mark" aria-hidden="true">{{ category.name[:1]|upper }}</span>
        {% endif %}
      </a>
      {% endfor %}
    </div>
  </div>
</section>
{% endif %}
