<section class="home-promotion-section" aria-labelledby="home-promotion-heading">
  <div class="container">
    <div class="home-promotion">
      <div class="home-promotion-copy">
        <span class="home-promotion-eyebrow">FLEXIBLE WAYS TO BUY</span>
        <h2 id="home-promotion-heading">{{ design_settings.promotion_title or 'Upgrade your setup' }}</h2>
        <p>{{ design_settings.promotion_subtitle or 'Explore current products and available installment plans from Nadeem Electronics.' }}</p>
        <div class="home-promotion-actions">
          <a class="home-promotion-cta" href="{{ url_for('public.shop') }}">Shop now <span aria-hidden="true">→</span></a>
          <a class="home-promotion-secondary" href="{{ url_for('public.installments') }}">{{ design_settings.promotion_button_text or 'Explore installments' }} <span aria-hidden="true">↗</span></a>
        </div>
      </div>
      <div class="home-promotion-art" aria-hidden="true">
        <span class="home-promotion-orbit"></span>
        <svg viewBox="0 0 180 180" fill="none">
          <rect x="40" y="15" width="100" height="150" rx="17" fill="#121a25" stroke="#95a7bb" stroke-width="2"/>
          <rect x="47" y="27" width="86" height="126" rx="10" fill="#152c47"/>
          <path d="M47 105 98 27h35v32l-78 80v-34Z" fill="#168bff" fill-opacity=".88"/>
          <path d="m85 153 48-49v49H85Z" fill="#f59e0b"/>
          <rect x="77" y="20" width="27" height="4" rx="2" fill="#6c7c91"/>
          <circle cx="90" cy="158" r="2" fill="#eaf3ff"/>
        </svg>
        <span class="home-promotion-orbit home-promotion-orbit-small"></span>
      </div>
    </div>
  </div>
</section>
