<section class="dashboard-section dashboard-new-arrivals">
  <div class="container">
    <div class="dashboard-section-heading dashboard-section-heading-row">
      <div>
        <h2 class="section-title">New arrivals</h2>
        <p class="section-subtitle">Fresh technology from the latest additions to our catalog.</p>
      </div>
      <a href="{{ url_for('public.shop') }}" class="dashboard-text-link">View all <span aria-hidden="true">→</span></a>
    </div>
    <div class="row g-3 g-lg-4 dashboard-product-grid">
      {% for product in latest_products %}
      <div class="col-6 col-lg-3">{% include '_product_card.html' %}</div>
      {% else %}
      <div class="col-12">
        <div class="dashboard-empty-state">No new arrivals yet.</div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
